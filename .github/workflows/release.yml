name: Release

# Publishes ng-dyno-form to npm when a GitHub release is published, or when
# run manually from the Actions tab for an existing tag (to retry a release).
# Uses npm trusted publishing (OIDC), so no npm token is stored in GitHub.
# One-time setup on npmjs.com: package settings → Trusted Publisher →
# GitHub Actions, repository kowsyap/dynoForm, workflow release.yml,
# no environment, with "Allow npm publish" ticked.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, e.g. v1.1.0
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}

      # No registry-url here: that writes an .npmrc with a placeholder token,
      # and trusted publishing must not use a token.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@11

      - name: Check publishing prerequisites
        run: |
          echo "node $(node -v), npm $(npm -v)"
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "::error::No OIDC token available. The job needs 'permissions: id-token: write'."
            exit 1
          fi
          version=$(node -p "require('./projects/ng-dyno-form/package.json').version")
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Tag $TAG does not match package version $version"
            exit 1
          fi

      - run: npm ci

      - name: Build library
        run: npx ng build ng-dyno-form

      - name: Test library
        run: npx ng test ng-dyno-form --watch=false --browsers=ChromeHeadlessCI

      - name: Publish to npm
        run: npm publish ./dist/ng-dyno-form --access public
